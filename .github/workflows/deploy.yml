name: Сборка и публикация сайта

on:
  push:
    branches:
      - main
  # Чтобы можно было запустить руками из вкладки Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    # Quartz лежит в .site — точка прячет его от Obsidian, который
    # индексирует этот же репозиторий как хранилище.
    working-directory: .site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # для дат из истории git
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Что в окружении
        run: |
          node --version
          npm --version
          pwd
          ls -la
      - name: Установить зависимости
        run: npm ci
      - name: Установить плагины Quartz
        run: npx quartz plugin install --from-config
      - name: Собрать сайт
        run: npx quartz build
      - name: Выложить артефакт
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
