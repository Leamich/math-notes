name: Сборка и публикация сайта

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    # Quartz лежит в .site — точка прячет его от Obsidian, который
    # индексирует этот же репозиторий как хранилище.
    working-directory: .site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # для дат из истории git
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Кеш зависимостей
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('.site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Кеш плагинов Quartz
        uses: actions/cache@v5
        with:
          path: .site/.quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('.site/quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Установить зависимости
        run: npm ci
      - name: Установить плагины Quartz
        run: npx quartz plugin install --from-config
      - name: Собрать сайт
        run: npx quartz build
      - name: Выложить артефакт
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
